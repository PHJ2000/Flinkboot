name: Java 17 Weekly Check

on:
  schedule:
    # Runs every Friday at 18:00 UTC (20:00 CEST)
    - cron: '0 18 * * 5'
  workflow_dispatch:

jobs:
  test-java17:
    name: Test on Java 17 (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests on Java 17
        run: mvn -B test -T 1C --file pom.xml

      - name: Upload Surefire Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-test-reports-java17
          path: '**/target/surefire-reports/'
          retention-days: 7
